<!DOCTYPE html>
<html>

<head>
    <title>Chat App</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h1>Chat App</h1>

    <h2 id="welcome"></h2>
    <div id="send-message">
        <textarea id="msg" placeholder="Mesaage"></textarea>
        <button id="send-button"></button>
    </div>
    <p id="error"></p>

    <div id="messages"></div>

    <button id="clear-allMessages">
        Clear the chat
    </button>

    <button id="logout-button">
        Leave Chat
    </button>
    
    <script src="index.js"></script>
</body>

</html>
