<!doctype html>
<html>
  <head>
    <title>Chat App</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <h1>Chat App</h1>

    <div class="header">
        <h2 id="welcome"></h2>
        
        <div class="header-actions">
          <button id="private-chat-button">Private Chat</button>
          <button id="clear-allMessages">Clear the chat</button>
          <button id="logout-button">Leave Chat</button>
        </div>
    </div>

    <div id="send-message">
      <textarea id="msg" placeholder="Mesaage"></textarea>
      <button id="send-button"></button>
    </div>

    <p id="error"></p>

    <div id="messages"></div>
    

    <script src="config.js"></script>
    <script src="chat-utils.js"></script>
    <script src="api.js"></script>
    <script src="render.js"></script>
    <script src="websocket.js"></script>
    <script src="chat.js"></script>
  </body>
</html>
